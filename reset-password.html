<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114"><title>Reset password · BassemTV</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script defer src="reset-password.js"></script>
  <style>
    body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#292315 0%,#151515 42%,#0d0e10 100%);display:grid;place-items:center;padding:24px;color:#f4f1e9}
    .reset-card{width:min(100%,440px);background:#17181b;border:1px solid #5b4925;border-radius:20px;padding:34px;box-shadow:0 24px 80px #0009}
    .reset-brand{text-align:center;margin-bottom:28px}.reset-brand .brand-mark{margin:0 auto 12px}.reset-brand .eyebrow{letter-spacing:.28em;color:#d4ad58;font-weight:700}.reset-card h1{text-align:center;font-size:27px;margin:0 0 10px}.reset-card .muted{text-align:center;line-height:1.6;margin:0 0 24px;color:#a9a9a9}
    .reset-card label{display:block;font-size:13px;color:#d8d3c8;margin:16px 0 7px}.reset-card input{width:100%;margin-top:7px}.reset-card .btn{margin-top:20px}.reset-message{min-height:24px;margin-top:16px;text-align:center;font-size:13px;color:#d8b66b;overflow-wrap:anywhere}.reset-message.error{color:#f08b83}.reset-back{display:block;text-align:center;margin-top:20px;color:#d8b66b;text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <main class="reset-card">
    <div class="reset-brand"><div class="brand-mark">B</div><p class="eyebrow">BASSEM TV</p></div>
    <section id="loadingState"><h1>Verifying your link</h1><p class="muted">Please wait while we securely verify your password-reset request.</p></section>
    <form id="passwordForm" class="hidden">
      <h1>Choose a new password</h1><p class="muted">Create a strong password for your BassemTV administrator account.</p>
      <label>New password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Confirm new password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
      <button id="saveButton" class="btn primary full" type="submit">Save new password</button>
    </form>
    <div id="resetMessage" class="reset-message" role="status" aria-live="polite"></div>
    <a class="reset-back" href="./">Back to BassemTV login</a>
  </main>
</body>
</html>
